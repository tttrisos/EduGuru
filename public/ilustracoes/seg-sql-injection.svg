<rect x="30" y="24" width="260" height="190" rx="8" fill="#202024" stroke="#c4b5fd" stroke-width="2" /><text class="t" x="160" y="56" font-size="17" fill="#e1e1e6" text-anchor="middle" font-weight="700">Entrar</text><text class="t" x="50" y="86" font-size="13" fill="#8d8d99" text-anchor="start" font-weight="400">Usuário</text><rect x="50" y="94" width="220" height="34" rx="8" fill="#1a1a1f" stroke="#f87171" stroke-width="2" /><text class="t m" x="62" y="116" font-size="15" fill="#f87171" text-anchor="start" font-weight="700">admin' --</text><text class="t" x="50" y="150" font-size="13" fill="#8d8d99" text-anchor="start" font-weight="400">Senha</text><rect x="50" y="158" width="220" height="34" rx="8" fill="#1a1a1f" stroke="#323238" stroke-width="2" /><text class="t m" x="62" y="180" font-size="15" fill="#e1e1e6" text-anchor="start" font-weight="400">••••••</text><text class="t" x="320" y="172" font-size="13" fill="#8d8d99" text-anchor="start" font-weight="400">O sistema monta a consulta</text><text class="t" x="320" y="192" font-size="13" fill="#8d8d99" text-anchor="start" font-weight="400">juntando o texto digitado:</text><rect x="30" y="232" width="580" height="64" rx="8" fill="#16161a" stroke="#323238" stroke-width="2" /><text class="t m" x="46" y="258" font-size="13" fill="#e1e1e6" xml:space="preserve"><tspan fill="#c4b5fd">SELECT</tspan> * <tspan fill="#c4b5fd">FROM</tspan> usuarios <tspan fill="#c4b5fd">WHERE</tspan> login = <tspan fill="#f87171" font-weight="700">'admin' --</tspan></text><text class="t m" x="46" y="282" font-size="13" fill="#8d8d99" xml:space="preserve">' AND senha = '......'   ← virou comentário</text><line x1="300" y1="110" x2="360" y2="110" stroke="#f87171" stroke-width="2" marker-end="url(#seta)"/><text class="t" x="370" y="104" font-size="14" fill="#f87171" text-anchor="start" font-weight="600">texto vira</text><text class="t" x="370" y="124" font-size="14" fill="#f87171" text-anchor="start" font-weight="600">parte do SQL?</text>
